kind = "web"
previewPath = "/"
title = "Edward & Amaury Solicitors"
version = "1.0.0"
id = "artifacts/ea-solicitors"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19608

[services.development]
run = "pnpm --filter @workspace/ea-solicitors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ea-solicitors", "run", "build" ]
publicDir = "artifacts/ea-solicitors/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19608"
BASE_PATH = "/"
